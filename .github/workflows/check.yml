name: Local benchmark code checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q harness_benchmark experiment_api scripts tests
      - run: python -m harness_benchmark plan --config configs/benchmark.json
      - run: python -m unittest discover -s tests -v
